<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!--
    Monochrome notification badge for Android Chrome's small-icon slot.
    White on transparent is required — the OS tints it with the system
    accent. A full-colour PNG appears as a solid black square here (which
    is what was happening with /pwa-192.png).
    Simple bell silhouette: instantly recognisable, scales well, doesn't
    compete with the big colour icon next to it.
  -->
